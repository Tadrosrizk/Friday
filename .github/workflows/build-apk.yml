name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: | SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager") yes | "$SDKM" --licenses > /dev/null || true "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 
      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Use one fixed signing key (so new versions install over old ones)
        run: | echo "" | base64 -d > android/app/friday.keystore cat >> android/app/build.gradle <<'EOF' 
          android {
              signingConfigs {
                  debug {
                      storeFile file('friday.keystore')
                      storePassword 'friday-debug'
                      keyAlias 'friday'
                      keyPassword 'friday-debug'
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: | chmod +x ./gradlew ./gradlew assembleDebug --no-daemon --stacktrace 
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk attendance-app.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: attendance-app.apk

      - name: Publish the APK on the Releases page (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة من التطبيق
          body: حمّل الملف attendance-app.apk وثبّته على الموبايل.
          files: attendance-app.apk
